name: 'Update by stargazed'
# This workflow runs at 00:30 every Sunday
on:
  schedule:
    -
      cron: '30 0 * * 0'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    name: 'stargazed update'
    runs-on: ubuntu-latest
    steps:
      -
        name: 'Use GitHub Actions'
        uses: actions/checkout@v7
      -
        name: 'Use Node.js 24.x'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      -
        name: 'Install Package'
        run: 'npm install --global stargazed'
      -
        name: 'Update Repo'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: 'stargazed --username  "henrilhos" --token ${GITHUB_TOKEN} --repo "awesome-stars" --message "stargazed update by GitHub Actions Workflow" --sort'
